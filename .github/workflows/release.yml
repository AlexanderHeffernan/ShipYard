name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine release version
        id: version
        run: echo "version=$(node scripts/release-version.mjs)" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    permissions:
      contents: write
    runs-on: macos-latest
    strategy:
      fail-fast: false
      # tauri-action updates latest.json by reading, replacing, and re-uploading
      # the release asset. Keep these jobs serialized so the two architecture
      # entries cannot overwrite each other.
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Set release version
        run: node scripts/set-release-version.mjs "${{ needs.version.outputs.version }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run build

      - name: Build and publish macOS release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: "v${{ needs.version.outputs.version }}"
          releaseName: "Shipyard v${{ needs.version.outputs.version }}"
          releaseBody: 'Signed macOS update for Shipyard.'
          generateReleaseNotes: true
          # Do not expose a release through /releases/latest until both
          # architectures have contributed to latest.json.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: "--target ${{ matrix.target }}"

  publish-release:
    needs:
      - version
      - publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify updater manifest
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "v${{ needs.version.outputs.version }}"
        run: |
          set -euo pipefail

          release_pages_json="$(mktemp)"
          release_json="$(mktemp)"
          manifest_json="$(mktemp)"

          # GitHub returns 404 from /releases/tags/{tag} while the matching
          # release is a draft. Enumerate releases, then use the numeric ID.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$release_pages_json"
          jq -s 'add' "$release_pages_json" > "$release_json"
          release_id="$(node scripts/release-workflow.mjs release-id "$release_json" "$RELEASE_TAG")"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$release_json"
          manifest_id="$(node scripts/release-workflow.mjs manifest-asset-id "$release_json" "$RELEASE_TAG")"

          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${manifest_id}" \
            > "$manifest_json"

          node scripts/release-workflow.mjs validate-manifest "$manifest_json" "$RELEASE_TAG"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "Validated complete updater manifest for ${RELEASE_TAG}."

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "v${{ needs.version.outputs.version }}"
          RELEASE_ID: ${{ steps.verify.outputs.release_id }}
        run: |
          set -euo pipefail

          published_release_json="$(mktemp)"
          gh api \
            --method PATCH \
            --field draft=false \
            --raw-field make_latest=true \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > "$published_release_json"
          node scripts/release-workflow.mjs verify-published \
            "$published_release_json" "$RELEASE_TAG"
